<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D ASCII Buket</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&family=Great+Vibes&display=swap">
<style>
:root{--ink:#f3e6ff;--panel:rgba(18,6,36,.66);--line:rgba(220,180,255,.28);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 30%,#2b0f45 0%,#170a2c 50%,#0b0516 100%);color:var(--ink);font-family:"Fira Code","Courier New",ui-monospace,monospace;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.panel{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center;padding:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:999px;backdrop-filter:blur(8px);font-size:13px;max-width:calc(100% - 20px)}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 13px;cursor:pointer}
button:hover{background:rgba(255,160,230,.18)}
label{display:flex;align-items:center;gap:6px}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
@media(max-width:600px){.panel{font-size:12px;padding:6px 10px;gap:6px 10px}.panel button{padding:4px 10px}input[type=range]{width:60px}.hint{font-size:11px}}
input[type=range]{accent-color:#ff8fd8;width:84px}
.hint{position:fixed;top:max(10px,env(safe-area-inset-top,0px));left:0;right:0;text-align:center;opacity:.6;font-size:12px;pointer-events:none}
.name{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 24px);text-align:center;pointer-events:none;opacity:0;font-family:"Great Vibes","Brush Script MT",cursive;font-size:clamp(38px,9vw,60px);line-height:1;background:linear-gradient(90deg,#ffb8e6,#e6d0ff,#ffc8e0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,150,220,.55))}
.name small{display:block;font:700 11px "Fira Code",monospace;letter-spacing:.35em;margin-top:6px;color:#f3e6ff;-webkit-text-fill-color:#f3e6ff;opacity:.75}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="name" id="nm">Zehra<small>senin için</small></div>
<div class="hint">Sürükle: döndür · Tekerlek / sıkıştır: yakınlaştır · Çift tık: sıfırla</div>
<div class="panel">
  <button id="replay">Yeniden dik</button>
  <button id="pause">Duraklat</button>
  <button id="rst">Sıfırla</button>
  <label>Hız <input id="spd" type="range" min="0.3" max="2.5" step="0.1" value="1"></label>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const ease=t=>t<0?0:t>1?1:t*t*(3-2*t),rnd=(a,b)=>a+Math.random()*(b-a);
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>v/16),RAMP=" .:-=+*#%@";
const S=2;
let W,H,DPR,FS=6,CW,CH,cols,rows,GW,GH,K,D=110,zb,cr,cg,cb,cn,zoom=1;

const mul=(A,B)=>{const r=[];for(let i=0;i<3;i++)for(let j=0;j<3;j++)r.push(A[i*3]*B[j]+A[i*3+1]*B[3+j]+A[i*3+2]*B[6+j]);return r};
const rx=t=>{const c=Math.cos(t),s=Math.sin(t);return[1,0,0,0,c,-s,0,s,c]};
const ry=t=>{const c=Math.cos(t),s=Math.sin(t);return[c,0,s,0,1,0,-s,0,c]};
const ap=(M,x,y,z)=>[M[0]*x+M[1]*y+M[2]*z,M[3]*x+M[4]*y+M[5]*z,M[6]*x+M[7]*y+M[8]*z];
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const pal=a=>a.map(hx),lerp=(a,b,t)=>a+(b-a)*t;
const grad=(p,u)=>u<.5?p[0].map((v,i)=>lerp(v,p[1][i],u/.5)):p[1].map((v,i)=>lerp(v,p[2][i],(u-.5)/.5));
const nrm=v=>{const n=Math.hypot(...v);return v.map(x=>x/n)};
const L1=nrm([.35,.55,.75]),L2=nrm([-.7,.2,-.4]);

function mk(id,nu,nv,prof,curl,rug,ridge){
  const P=[],TR=[],TC=[];
  for(let i=0;i<=nu;i++)for(let j=0;j<=nv;j++){const u=i/nu,v=j/nv*2-1,w=prof(u);
    P.push([v*w*(1+rug*Math.sin(u*14+v*2)),u,-(curl[0]*v*v*w+curl[1]*u*u)+rug*.5*Math.sin(v*4+u*7)*w]);}
  for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){const a=i*(nv+1)+j,b=a+1,c=a+nv+1,d=c+1;
    [[a,b,c],[b,d,c]].forEach(t=>{TR.push(t);const u=t.reduce((s,k)=>s+Math.floor(k/(nv+1))/nu,0)/3,v=t.reduce((s,k)=>s+((k%(nv+1))/nv*2-1),0)/3;TC.push([u,v,ridge(u,v)])})}
  return{id,P,TR,TC};
}
// daha yuvarlak, geniş, ince damarlı taç yaprağı
const PET=mk('p',12,8,u=>Math.pow(Math.sin(Math.PI*Math.pow(u,.55)),.42),[.3,.2],.04,(u,v)=>.82+.18*Math.cos(v*Math.PI*4)*(1-u*.4)+.08*Math.exp(-v*v*30));
const LEAF=mk('l',10,5,u=>Math.sin(Math.PI*Math.pow(u,.8))*(1-.15*u),[.1,.22],0,(u,v)=>1-.35*Math.exp(-v*v*40));
const WX=new Float32Array(160),WY=new Float32Array(160),WZ=new Float32Array(160),SX=new Float32Array(160),SY=new Float32Array(160);

function tri(ax,ay,az,bx,by,bz,px,py,pz,R,G,B){
  const x0=Math.max(0,Math.floor(Math.min(ax,bx,px))),x1=Math.min(GW-1,Math.ceil(Math.max(ax,bx,px)));
  const y0=Math.max(0,Math.floor(Math.min(ay,by,py))),y1=Math.min(GH-1,Math.ceil(Math.max(ay,by,py)));
  const den=(by-py)*(ax-px)+(px-bx)*(ay-py);if(Math.abs(den)<1e-7)return;const id=1/den;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const qx=x+.5,qy=y+.5,l0=((by-py)*(qx-px)+(px-bx)*(qy-py))*id,l1=((py-ay)*(qx-px)+(ax-px)*(qy-py))*id,l2=1-l0-l1;
    if(l0<-.01||l1<-.01||l2<-.01)continue;
    const z=l0*az+l1*bz+l2*pz,i=y*GW+x;
    if(z>zb[i]){zb[i]=z;cr[i]=R;cg[i]=G;cb[i]=B;cn[i]=1}
  }
}
const px_=(X,Z)=>(W/2+X*K*D/(D-Z))/CW*S,py_=(Y,Z)=>(H*.53-Y*K*D/(D-Z))/CH*S;
function emit(T_,M,ox,oy,oz,len,wd,p,br){
  const P=T_.P,n=P.length;
  for(let k=0;k<n;k++){const q=P[k],x=q[0]*len*wd,y=q[1]*len,z=q[2]*len;
    const X=M[0]*x+M[1]*y+M[2]*z+ox,Y=M[3]*x+M[4]*y+M[5]*z+oy,Z=M[6]*x+M[7]*y+M[8]*z+oz;
    WX[k]=X;WY[k]=Y;WZ[k]=Z;SX[k]=px_(X,Z);SY[k]=py_(Y,Z)}
  const tc=p.tc||(p.tc={}),cl=tc[T_.id]||(tc[T_.id]=T_.TC.map(c=>{const g=grad(p,c[0]);return[g[0]*c[2],g[1]*c[2],g[2]*c[2]]}));
  for(let t=0;t<T_.TR.length;t++){
    const[a,b,c]=T_.TR[t],ux=WX[b]-WX[a],uy=WY[b]-WY[a],uz=WZ[b]-WZ[a],vx=WX[c]-WX[a],vy=WY[c]-WY[a],vz=WZ[c]-WZ[a];
    const nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx,nl=Math.hypot(nx,ny,nz)||1;
    const d1=Math.abs((nx*L1[0]+ny*L1[1]+nz*L1[2])/nl),d2=Math.abs((nx*L2[0]+ny*L2[1]+nz*L2[2])/nl);
    const fog=.8+.2*Math.max(0,Math.min(1,((WZ[a]+WZ[b]+WZ[c])/3+16)/32));
    const m=(.4+.56*d1+.18*d2)*br*fog,col=cl[t],sp=Math.pow(d1,9)*60*br;
    tri(SX[a],SY[a],WZ[a],SX[b],SY[b],WZ[b],SX[c],SY[c],WZ[c],col[0]*m+sp,col[1]*m+sp,col[2]*m+sp);
  }
}
function disc(M,o,r,h,col,br){
  const c=ap(M,0,h,0),cx=c[0]+o[0],cy=c[1]+o[1],cz=c[2]+o[2],A=px_(cx,cz),B=py_(cy,cz),n=14,q=[];
  for(let i=0;i<n;i++){const a=i/n*6.283,v=ap(M,Math.cos(a)*r,h*.3,Math.sin(a)*r),X=v[0]+o[0],Y=v[1]+o[1],Z=v[2]+o[2];q.push([px_(X,Z),py_(Y,Z),Z])}
  for(let i=0;i<n;i++){const a=q[i],b=q[(i+1)%n];tri(A,B,cz+.3,a[0],a[1],a[2]+.3,b[0],b[1],b[2]+.3,col[0]*br,col[1]*br,col[2]*br)}
}

const WH=pal(['#a79fc4','#ffffff','#fffaf0']);
const FL=[
 {fx:-.2,fy:.2,R:.22,n:8,col:pal(['#3a2682','#9b7ae0','#efe4ff']),ctr:hx('#f1e6ff'),d:3.2,phi:1.15},
 {fx:-.16,fy:.3,R:.22,n:8,col:pal(['#8a2e1c','#ff8a70','#ffe0c8']),ctr:hx('#ffe6d0'),d:3.8,phi:1.2},
 {fx:.22,fy:.17,R:.17,n:9,col:WH,ctr:hx('#e8d8a0'),d:4.4,phi:1.1},
 {fx:-.29,fy:.34,R:.29,n:8,col:pal(['#6e0840','#ff2d7e','#ffb4d4']),ctr:hx('#ffd0e0'),d:5,phi:1.25},
 {fx:.07,fy:.29,R:.15,n:8,col:pal(['#b04a80','#ff9ec4','#fff4f8']),ctr:hx('#fff8fa'),d:5.6,phi:1.2},
 {fx:.1,fy:.41,R:.28,n:7,col:pal(['#9a6402','#f5c518','#fff4a0']),core:pal(['#7a1408','#ee5a1a','#ffae4a']),ctr:hx('#6a1e0c'),d:6.2,phi:1.3},
 {fx:.4,fy:.38,R:.13,n:8,col:WH,ctr:hx('#e8d8a0'),d:7,phi:1.1},
 {fx:-.18,fy:.52,R:.25,n:9,col:WH,ctr:hx('#c9961a'),d:7.6,phi:1.3},
 {n:9,col:pal(['#5a0614','#d81e3c','#ff8a9a']),ctr:hx('#ffd0c0')},
 {n:8,col:pal(['#4a3a8a','#b9a4f0','#f2ecff']),ctr:hx('#fff0c0')},
 {n:8,col:pal(['#a04010','#ff9a50','#ffe0b0']),ctr:hx('#7a2a10')},
 {n:8,col:pal(['#2a5a9a','#7ab8f0','#e8f6ff']),ctr:hx('#fff4c0')},
 {n:8,col:pal(['#7a1068','#e040c0','#ffc0f0']),ctr:hx('#ffe8a0')},
 {n:7,col:pal(['#a02a3a','#ff7a8a','#ffd8d8']),ctr:hx('#fff0d0')}
];
const GREEN=pal(['#0f4f26','#2fa650','#a8f09a']),STAM=hx('#ffe9a0');
let stems=[];const LAY=[[-7.5,12.5,2,4.2],[-3,7.5,6,4],[5,7,5,3.5],[-.5,16.5,1,4.6],[11,10.5,-2,3.2],[5.5,13,3,4.2],[-11.5,8,-1,3.3],[1.5,2.5,8,3.8],[-5.5,19.5,-2,3.4],[5,20,-2,3.4],[-13,13.5,-3,3],[12.5,15,-3,3],[-7.5,3,4,3.4],[9,2.5,5,3.4]];
function build(){
  FL.forEach((f,i)=>{
    const q=LAY[i];f.P=[q[0],q[1],q[2]];f.psi=Math.atan2(q[0],8)*1.1;f.phi=.3+Math.min(.45,Math.abs(q[0])*.05)+rnd(-.06,.06);f.Rw=q[3];f.d=5.2+i*.22;
    const n=f.n,defs=[[n,1,.56,1.2,0],[n,.9,.54,1,.5],[n,.76,.5,.82,.25],[n-1,.58,.46,.62,.7],[Math.max(4,n-2),.38,.4,.42,.1]];
    f.lay=defs.map((l,li)=>({len:l[1],wd:l[2],th:l[3],pal:(li===4&&f.core)?f.core:f.col,pet:Array.from({length:l[0]},(_,p)=>({a:(l[4]+p)/l[0]*6.283+rnd(-.08,.08),ln:rnd(.94,1.06),th:rnd(-.08,.08),tw:rnd(-.15,.15),wd:rnd(.95,1.06)}))}));
    f.stam=Array.from({length:18},(_,k)=>({a:k/18*6.283+rnd(-.2,.2),r:rnd(.1,.26)}));
  });
  const mk2=(tip,i)=>({x0:rnd(-.6,.6),z0:rnd(-.8,.8),tip,b:[rnd(-4,4),rnd(-3,3)],s:i*.22,L:[rnd(.45,.58),rnd(.62,.76),rnd(.32,.42)],a:[rnd(0,6.3),rnd(0,6.3),rnd(0,6.3)]});
  stems=FL.map((f,i)=>mk2(f.P,i));
  for(let i=0;i<5;i++)stems.push(mk2([rnd(-9,9),rnd(5,11),rnd(-4,4)],i+1));
}
const quad=(s,t)=>{const v=1-t,p1=[s.x0+(s.tip[0]-s.x0)*.15+s.b[0]*.35,-24+(s.tip[1]+24)*.5,s.z0+(s.tip[2]-s.z0)*.15+s.b[1]*.35];
  return[v*v*s.x0+2*v*t*p1[0]+t*t*s.tip[0],-24*v*v+2*v*t*p1[1]+t*t*s.tip[1],v*v*s.z0+2*v*t*p1[2]+t*t*s.tip[2]]};

// ---- Etkileşim: yalnızca kullanıcı döndürür, otomatik hareket yok ----
let yaw=.15,pitch=.5,drag=false;const pts=new Map();
const reset=()=>{yaw=.15;pitch=.5;zoom=1;dirty=true};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);drag=true});
cv.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;const old=pts.get(e.pointerId);
  if(pts.size===2){const o=[...pts.values()],d0=Math.hypot(o[0][0]-o[1][0],o[0][1]-o[1][1]);pts.set(e.pointerId,[e.clientX,e.clientY]);const n=[...pts.values()],d1=Math.hypot(n[0][0]-n[1][0],n[0][1]-n[1][1]);
    if(d0>0)zoom=Math.max(.5,Math.min(2.4,zoom*d1/d0));return}
  pts.set(e.pointerId,[e.clientX,e.clientY]);
  yaw+=(e.clientX-old[0])*.009;pitch=Math.max(-1.3,Math.min(1.3,pitch+(e.clientY-old[1])*.007));
});
const up=e=>{pts.delete(e.pointerId);if(!pts.size)drag=false};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('dblclick',reset);
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.5,Math.min(2.4,zoom*(1-e.deltaY*.001)))},{passive:false});

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  FS=Math.max(3.4,Math.min(6.5,W/150));CW=FS*.6;CH=FS*1.1;cols=Math.ceil(W/CW);rows=Math.ceil(H/CH);GW=cols*S;GH=rows*S;
  const n=GW*GH;zb=new Float32Array(n);cr=new Float32Array(n);cg=new Float32Array(n);cb=new Float32Array(n);cn=new Uint8Array(n);
  ctx.font=`700 ${FS}px "Fira Code","Courier New",monospace`;ctx.textBaseline='middle';ctx.textAlign='center';
}
const cache=[];
const fillFor=(r,g,b)=>{r=Math.min(255,r)|0;g=Math.min(255,g)|0;b=Math.min(255,b)|0;const k=(r>>4)<<8|(g>>4)<<4|b>>4;return cache[k]||(cache[k]=`rgb(${Math.min(255,(r>>4)*17+10)},${Math.min(255,(g>>4)*17+10)},${Math.min(255,(b>>4)*17+10)})`)};
let T=1.2,paused=false,speed=1,last=0,acc=0,dirty=true,lp=-1,ly=-1,lz=-1;
const nm=document.getElementById('nm'),RIB=pal(['#8a1c5a','#ff5fb0','#ffd0ec']),PC=['#ff9ad5','#d7b8ff','#ffd1e8'],FXN=76,fxs=[];
for(let i=0;i<FXN;i++)fxs.push({x:Math.random(),y:Math.random(),p:rnd(0,6.3),s:rnd(.8,2.2),f:i>=46,v:rnd(.03,.07),i});
function drawFx(){
  const a=ease((T-7)/3),f0=ctx.font;
  nm.style.opacity=ease((T-11)/3);
  for(const q of fxs){
    if(q.f){if(!paused){q.y+=q.v*.032*speed;q.x+=Math.sin(T*q.s+q.p)*.0008;if(q.y>1.04){q.y=-.04;q.x=Math.random()}}
      ctx.globalAlpha=.85*a;ctx.fillStyle=PC[q.i%3];ctx.font=`700 ${FS*2.2}px "Fira Code",monospace`;ctx.fillText('*o+'[q.i%3],q.x*W,q.y*H)}
    else{ctx.globalAlpha=.1+.5*(.5+.5*Math.sin(T*q.s*1.6+q.p));ctx.fillStyle='#cdb8ff';ctx.font=f0;ctx.fillText('.+*'[q.i%3],q.x*W,q.y*H*.85)}
  }
  ctx.globalAlpha=1;ctx.font=f0;
}
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.1,(ts-(last||ts))/1000);last=ts;if(!paused)T+=dt*speed;
  acc+=dt;if(acc<.032)return;acc=0;
  // sahne durgunsa (duraklatılmış, etkileşim yok) yeniden çizme
  if(paused&&yaw===ly&&pitch===lp&&zoom===lz&&!dirty)return;
  ly=yaw;lp=pitch;lz=zoom;dirty=false;
  K=Math.min(W*.9,H*.52)/30*zoom;
  zb.fill(-1e9);cn.fill(0);
  const Rg=mul(rx(pitch),ry(yaw)),sc=new Map();
  stems.forEach(s=>{
    const g=ease((T-s.s)/5.5);if(g<=0)return;const fade=T>10?Math.max(.55,1-(T-10)*.08):1,N=90;
    for(let k=1;k<=N*g;k++){const t=k/N,a=quad(s,t),b=quad(s,Math.min(1,t+.02)),pa=ap(Rg,...a),pb=ap(Rg,...b);
      const ax=px_(pa[0],pa[2])/S,ay=py_(pa[1],pa[2])/S,bx=px_(pb[0],pb[2])/S,by=py_(pb[1],pb[2])/S,dx=(bx-ax)*CW,dy=(by-ay)*CH;
      const ch=Math.abs(dx)<.35*Math.abs(dy)?'|':dx*dy<0?'/':'\\',r=ay|0,c=ax|0;
      if(r>=0&&r<rows&&c>=0&&c<cols)sc.set(r*cols+c,[ch,t,fade])}
    s.L.forEach((t,i)=>{const kk=ease((g-t)/.25);if(kk<=0)return;const o=ap(Rg,...quad(s,t)),M=mul(Rg,mul(ry(s.a[i]),rx(1.15)));
      emit(LEAF,M,o[0],o[1],o[2],6*kk,.4,GREEN,.95*fade)});
  });
  FL.forEach((f,i)=>{
    if(T<f.d)return;
    const open=ease((T-f.d)/8.5),br=.6+.4*ease((T-f.d-1.5)/7);
    const Rf=mul(ry(f.psi),rx(f.phi)),M0=mul(Rg,Rf),o=ap(Rg,...f.P),R0=f.Rw*(.55+.45*open);
    f.lay.forEach((l,li)=>{
      l.pet.forEach((q,p)=>{const kk=ease(open*1.3-li*.07-p/l.pet.length*.12);if(kk<=0)return;
        const M=mul(M0,mul(ry(q.a),mul(rx(.08+(l.th+q.th-.08)*kk),ry(q.tw*kk))));
        emit(PET,M,o[0],o[1],o[2],R0*l.len*q.ln*(.5+.5*kk),l.wd*q.wd*1.12*(.7+.3*kk),l.pal,br)})});
    const dk=ease(open*1.5),dr=R0*.2*dk;
    disc(M0,o,dr*1.15,R0*.1,f.ctr.map(v=>v*.55),br);disc(M0,o,dr*.8,R0*.15,f.ctr,br);
    if(open>.5)f.stam.forEach(s=>{const v=ap(M0,Math.cos(s.a)*s.r*R0,R0*.14,Math.sin(s.a)*s.r*R0),X=v[0]+o[0],Y=v[1]+o[1],Z=v[2]+o[2],q=[px_(X,Z),py_(Y,Z)],e=.9*S;
      tri(q[0]-e,q[1]-e,Z+.5,q[0]+e,q[1]-e,Z+.5,q[0],q[1]+e,Z+.5,STAM[0]*br,STAM[1]*br,STAM[2]*br)});
  });
  const rb=ease((T-2)/2);
  if(rb>0){for(let k=0;k<4;k++)disc(Rg,ap(Rg,0,-16.6+k*.5,0),1.9,0,RIB[1],.95*rb);
    const bo=ap(Rg,0,-15.7,2);
    [-1,1].forEach(s=>emit(PET,mul(Rg,mul(ry(s*1.05),rx(1.25))),bo[0],bo[1],bo[2],3*rb,.8,RIB,1.1));
    [-.35,.35].forEach(s=>emit(LEAF,mul(Rg,mul(ry(s),rx(2.7))),bo[0],bo[1],bo[2],4.5*rb,.45,RIB,1))}
  ctx.clearRect(0,0,W,H);drawFx();
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    let n=0,R=0,G=0,B=0;
    for(let sy=0;sy<S;sy++){const base=(r*S+sy)*GW+c*S;for(let sx=0;sx<S;sx++){const i=base+sx;if(cn[i]){n++;R+=cr[i];G+=cg[i];B+=cb[i]}}}
    if(n<2)continue;const cov=n/(S*S);R/=n;G/=n;B/=n;
    let v=Math.pow((.3*R+.59*G+.11*B)/255,.7)*1.6*Math.pow(cov,.6)+(BAY[(r&3)*4+(c&3)]-.5)*.08;v=v<.14&&cov>.5?.14:v;v=v<0?0:v>1?1:v;
    const idx=Math.round(v*(RAMP.length-1));if(!idx)continue;
    if(cov>.5)sc.delete(r*cols+c);ctx.fillStyle=fillFor(R*1.1,G*1.1,B*1.1);ctx.fillText(RAMP[idx],c*CW+CW/2,r*CH+CH/2);
  }
  for(const[key,[ch,t,fade]]of sc){ctx.fillStyle=fillFor((37+101*t)*fade,(144+88*t)*fade,(74+80*t)*fade);ctx.fillText(ch,(key%cols)*CW+CW/2,(key/cols|0)*CH+CH/2)}
}
document.getElementById('replay').onclick=()=>{T=1.2;build();dirty=true};
const pb=document.getElementById('pause');pb.onclick=()=>{paused=!paused;pb.textContent=paused?'Devam':'Duraklat'};
document.getElementById('rst').onclick=reset;
document.getElementById('spd').oninput=e=>speed=+e.target.value;
addEventListener('resize',()=>{resize();dirty=true});
build();resize();
if(document.fonts)document.fonts.load('700 10px "Fira Code"').then(()=>{resize();dirty=true}).catch(()=>{});
requestAnimationFrame(frame);
</script>
